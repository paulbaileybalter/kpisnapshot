name = "kpisnapshot"
compatibility_date = "2024-09-01"
pages_build_output_dir = "."

# Local dev only — in the Cloudflare dashboard the binding is added under
# Workers & Pages → your project → Settings → Functions → KV namespace bindings.
# Run `npx wrangler kv namespace create BALTER_KV` once, then paste the id below
# and into the dashboard binding (name it BALTER_KV in both places).
[[kv_namespaces]]
binding = "BALTER_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
